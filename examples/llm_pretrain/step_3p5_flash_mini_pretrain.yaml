# Pretraining config for a StepFun Step-3.5-Flash-style toy model.
#
# The model shape follows SteptronOss playground/pretrain/step3p5/step3p5_toy.py:
# hidden_size=2048, num_layers=48, num_experts=128, expert_hidden_size=768,
# shared_expert_dim=768, FFN hidden size=7168, and SWA pattern [SWA, SWA, SWA, full] x 12.
#
# SteptronOss uses TP=8, PP=1, CP=1, EP=8 for this toy. AutoModel Step3p5 does
# not currently expose a tensor-parallel plan, so this recipe keeps tp_size=1
# and uses dp_size=8 with ep_size=8 for an 8-GPU runnable topology.

recipe: TrainFinetuneRecipeForNextTokenPrediction

seed: 1234

step_scheduler:
  global_batch_size: 1024
  local_batch_size: 1
  ckpt_every_steps: 2000
  val_every_steps: 1000
  num_epochs: 1
  max_steps: 10000

dist_env:
  backend: nccl
  timeout_minutes: 10

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1234
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_config
  config:
    _target_: nemo_automodel.components.models.step3p7.configuration_step3p7.Step3p7TextConfig
    hidden_size: 2048
    intermediate_size: 7168
    num_attention_heads: 16
    num_attention_groups: 2
    num_hidden_layers: 48
    max_seq_len: 131072
    vocab_size: 128896
    rms_norm_eps: 1e-5
    moe_intermediate_size: 768
    moe_num_experts: 128
    moe_top_k: 8
    max_position_embeddings: 131072
    share_expert_dims: 768
    share_expert_dim: 768
    head_dim: 256
    norm_expert_weight: true
    sliding_window: 512
    attention_dropout: 0.0
    use_head_wise_attn_gate: true
    use_moe_router_bias: true
    moe_router_activation: sigmoid
    moe_router_scaling_factor: 3.0
    need_fp32_gate: true
